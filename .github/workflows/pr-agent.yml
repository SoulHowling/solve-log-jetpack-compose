name: PR Code Review
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (!github.event.comment.body || startsWith(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pr_agent
        uses: qodo-ai/pr-agent@v0.39.0
        env:
          CONFIG.MODEL: "gemini/gemini-3.5-flash"
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: 64000
          PR_REVIEWER.NUM_CODE_SUGGESTIONS: 5
          PR_REVIEWER.INLINE_CODE_COMMENTS: true
          PR_IMPROVE.INLINE_CODE_COMMENTS: true
          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: "必ず日本語で回答してください。解説や指摘文に英語を混ぜないでください。"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "必ず日本語で回答してください。"
          PR_DESCRIPTION.EXTRA_INSTRUCTIONS: "必ず日本語で回答してください。"
