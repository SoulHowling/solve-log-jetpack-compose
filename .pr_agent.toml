[pr_reviewer]
inline_comments = true
num_code_suggestions = 5
minimal_commendable_issue_score = 1
prompt_custom_instructions = "Please ensure that every issue found provides a clear code snippet of the proposed fix, formatted as a standard markdown diff block."
extra_instructions = """
- レビューのコメントは必ず日本語で出力してください。
- レビューコメントに対して「対応しない」という旨の返信がされた場合、その後、そのPRで同じ内容のレビューコメントはしないでください。
- 現在、このリポジトリは開発中で未リリースです。そのため、Databaseの構造が変更された場合でもDatabaseのバージョンを更新する必要はないため、その指摘はしないでください。
"""

[ pr_description ]
extra_instructions = """
- PRのサマリや変更点の概要は必ず日本語で出力してください。
"""